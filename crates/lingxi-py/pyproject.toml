[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "lingxi"
description = "繁體中文分詞與詞性標註（Rust 核心）"
requires-python = ">=3.9"
license = { text = "MIT" }
dynamic = ["version"]

[tool.maturin]
python-source = "python"
module-name = "lingxi._core"
features = ["pyo3/extension-module"]
